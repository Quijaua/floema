services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floema_app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql_db

  mysql_db:
    image: mysql:8.0
    container_name: floema_db
    command: --default-authentication-plugin=mysql_native_password --skip-ssl --sql_mode=""
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: floema_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
